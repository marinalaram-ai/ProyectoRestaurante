<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonante — Reproductor de música</title>
    <style>
        :root {
            --bg: #17131f;
            --bg-panel: #1f1a29;
            --bg-panel-2: #251f31;
            --line: #34293f;
            --text: #f1ece2;
            --text-dim: #a89cb8;
            --accent: #e2a23b;
            --accent-dim: #6a4f22;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }

        .app {
            display: grid;
            grid-template-columns: 320px 1fr;
            grid-template-rows: auto 1fr;
            grid-template-areas:
                "header header"
                "sidebar main";
            min-height: 100vh;
            max-width: 1180px;
            margin: 0 auto;
        }

        header.top {
            grid-area: header;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 22px 28px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 22px;
            letter-spacing: 0.3px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
        }

        .search-wrap {
            flex: 1;
            max-width: 420px;
            position: relative;
        }

        .search-wrap input {
            width: 100%;
            background: var(--bg-panel);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 10px 14px 10px 36px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .search-wrap input:focus {
            border-color: var(--accent);
        }

        .search-wrap svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            stroke: var(--text-dim);
        }

        aside.sidebar {
            grid-area: sidebar;
            border-right: 1px solid var(--line);
            padding: 20px 10px 20px 28px;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 12px;
            letter-spacing: 0.4px;
            color: var(--text-dim);
            margin: 4px 0 14px;
            font-weight: 500;
        }

        ul.tracklist {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        li.track {
            display: grid;
            grid-template-columns: 26px 1fr 40px;
            align-items: center;
            gap: 12px;
            padding: 9px 10px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-dim);
        }

        li.track:hover {
            background: var(--bg-panel);
            color: var(--text);
        }

        li.track.active {
            background: var(--bg-panel-2);
            color: var(--text);
        }

        li.track.active .track-index {
            color: var(--accent);
        }

        li.track.active .track-title {
            color: var(--accent);
        }

        .track-index {
            font-size: 12px;
            text-align: center;
            color: inherit;
        }

        .track-info {
            overflow: hidden;
        }

        .track-title {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: inherit;
        }

        .track-artist {
            font-size: 12px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-dur {
            font-size: 12px;
            text-align: right;
            color: var(--text-dim);
        }

        .empty-state {
            color: var(--text-dim);
            font-size: 13px;
            padding: 14px 10px;
        }

        main.player {
            grid-area: main;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 40px 30px;
            gap: 26px;
            text-align: center;
        }

        .cover {
            width: 260px;
            height: 260px;
            border-radius: 10px;
            background: radial-gradient(circle at 30% 30%, #3a2e4a, #1c1626 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .cover.spinning::after {
            content: "";
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--accent-dim);
            box-shadow: 0 0 0 24px rgba(226, 162, 59, 0.06);
        }

        .cover svg {
            width: 64px;
            height: 64px;
            stroke: var(--accent);
            opacity: 0.85;
            z-index: 1;
        }

        .now-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 26px;
            margin: 0;
        }

        .now-artist {
            color: var(--text-dim);
            margin: 2px 0 0;
            font-size: 14px;
        }

        .hint {
            font-size: 12px;
            color: var(--text-dim);
            margin: -14px 0 0;
        }

        .progress-wrap {
            width: 100%;
            max-width: 420px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time {
            font-size: 11px;
            color: var(--text-dim);
            width: 34px;
        }

        .time.end {
            text-align: right;
        }

        .progress-track {
            flex: 1;
            height: 4px;
            background: var(--line);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            background: var(--accent);
            border-radius: 4px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .controls button {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 6px;
            display: flex;
        }

        .controls button svg {
            width: 20px;
            height: 20px;
            stroke: var(--text);
            fill: none;
        }

        .controls .play-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
        }

        .controls .play-btn svg {
            stroke: none;
            fill: var(--bg);
            width: 18px;
            height: 18px;
        }

        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dim);
        }

        .volume-wrap svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-dim);
        }

        input[type="range"].volume {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 4px;
            border-radius: 4px;
            background: var(--line);
            outline: none;
        }

        input[type="range"].volume::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text);
            cursor: pointer;
        }

        @media (max-width: 720px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-areas: "header" "main" "sidebar";
            }

            aside.sidebar {
                border-right: none;
                border-top: 1px solid var(--line);
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <header class="top">
            <div class="brand"><span class="dot"></span>Resonante</div>
            <div class="search-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                    <circle cx="11" cy="11" r="7" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input id="searchInput" type="text" placeholder="Buscar por canción o artista…" autocomplete="off">
            </div>
        </header>

        <aside class="sidebar">
            <h2>Lista de reproducción</h2>
            <ul class="tracklist" id="tracklist"></ul>
        </aside>

        <main class="player">
            <div class="cover" id="cover">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                    <path d="M9 18V5l12-2v13" />
                    <circle cx="6" cy="18" r="3" />
                    <circle cx="18" cy="16" r="3" />
                </svg>
            </div>

            <div>
                <p class="now-title" id="nowTitle">—</p>
                <p class="now-artist" id="nowArtist">Selecciona una canción</p>
            </div>

            <p class="hint" id="hintText">Pulsa play para escuchar (el sonido se genera en el navegador, sin conexión a
                internet)</p>

            <div class="progress-wrap">
                <span class="time" id="timeCurrent">0:00</span>
                <div class="progress-track" id="progressTrack">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="time end" id="timeTotal">0:00</span>
            </div>

            <div class="controls">
                <button id="prevBtn" title="Anterior">
                    <svg viewBox="0 0 24 24" stroke-width="2">
                        <polygon points="19 20 9 12 19 4 19 20" />
                        <line x1="5" y1="19" x2="5" y2="5" />
                    </svg>
                </button>
                <button class="play-btn" id="playBtn" title="Reproducir">
                    <svg id="playIcon" viewBox="0 0 24 24">
                        <polygon points="6 4 20 12 6 20 6 4" />
                    </svg>
                </button>
                <button id="nextBtn" title="Siguiente">
                    <svg viewBox="0 0 24 24" stroke-width="2">
                        <polygon points="5 4 15 12 5 20 5 4" />
                        <line x1="19" y1="5" x2="19" y2="19" />
                    </svg>
                </button>
            </div>

            <div class="volume-wrap">
                <svg viewBox="0 0 24 24" stroke-width="2">
                    <path d="M11 5 6 9H2v6h4l5 4V5z" />
                    <path d="M15.5 8.5a5 5 0 0 1 0 7" />
                </svg>
                <input type="range" class="volume" id="volumeSlider" min="0" max="100" value="60">
            </div>
        </main>

    </div>

    <script>
        const scales = {
            mayor: [0, 2, 4, 7, 9, 12, 9, 7],
            menor: [0, 3, 5, 7, 10, 12, 10, 7],
            pentatonica: [0, 3, 5, 7, 10, 12, 10, 5],
        };

        function notesFromScale(rootHz, pattern) {
            return pattern.map(semitones => rootHz * Math.pow(2, semitones / 12));
        }

        const songs = [
            { title: "Luz de neón", artist: "Marea Digital", duration: 40, root: 220.00, scale: "mayor", tempo: 260, wave: "triangle" },
            { title: "Camino de regreso", artist: "Sonido Lento", duration: 44, root: 196.00, scale: "menor", tempo: 320, wave: "sine" },
            { title: "Vértigo", artist: "Andrea Villalba", duration: 36, root: 246.94, scale: "pentatonica", tempo: 210, wave: "square" },
            { title: "Horas extra", artist: "Los del Barrio", duration: 42, root: 174.61, scale: "menor", tempo: 240, wave: "triangle" },
            { title: "Marea alta", artist: "Nadie en Casa", duration: 46, root: 261.63, scale: "mayor", tempo: 300, wave: "sine" },
            { title: "Sal y limón", artist: "Costa Norte", duration: 38, root: 293.66, scale: "pentatonica", tempo: 230, wave: "triangle" },
            { title: "Retorno", artist: "Marea Digital", duration: 45, root: 220.00, scale: "menor", tempo: 270, wave: "square" },
        ].map(s => ({ ...s, notes: notesFromScale(s.root, scales[s.scale]) }));

        let audioCtx = null;
        let masterGain = null;
        let currentIndex = 0;
        let isPlaying = false;
        let elapsed = 0;
        let progressTimer = null;
        let noteTimer = null;
        let noteStep = 0;
        let filteredIndices = songs.map((_, i) => i);

        const tracklistEl = document.getElementById('tracklist');
        const searchInput = document.getElementById('searchInput');
        const nowTitleEl = document.getElementById('nowTitle');
        const nowArtistEl = document.getElementById('nowArtist');
        const coverEl = document.getElementById('cover');
        const progressFill = document.getElementById('progressFill');
        const progressTrack = document.getElementById('progressTrack');
        const timeCurrentEl = document.getElementById('timeCurrent');
        const timeTotalEl = document.getElementById('timeTotal');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const hintText = document.getElementById('hintText');

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function ensureAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = volumeSlider.value / 100;
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playNote(freq, durationSec, wave) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = wave;
            osc.frequency.value = freq;

            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.35, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + durationSec);

            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            osc.stop(now + durationSec + 0.05);
        }

        function scheduleMelody() {
            const song = songs[currentIndex];
            clearInterval(noteTimer);
            noteTimer = setInterval(() => {
                const freq = song.notes[noteStep % song.notes.length];
                playNote(freq, song.tempo / 1000 * 0.9, song.wave);
                noteStep++;
            }, song.tempo);
        }

        function renderTracklist() {
            tracklistEl.innerHTML = '';

            if (filteredIndices.length === 0) {
                const li = document.createElement('li');
                li.className = 'empty-state';
                li.textContent = 'No se encontraron canciones.';
                tracklistEl.appendChild(li);
                return;
            }

            filteredIndices.forEach((songIndex, pos) => {
                const song = songs[songIndex];
                const li = document.createElement('li');
                li.className = 'track' + (songIndex === currentIndex ? ' active' : '');
                li.innerHTML = `
      <span class="track-index">${pos + 1}</span>
      <span class="track-info">
        <div class="track-title">${song.title}</div>
        <div class="track-artist">${song.artist}</div>
      </span>
      <span class="track-dur">${formatTime(song.duration)}</span>
    `;
                li.addEventListener('click', () => loadSong(songIndex, true));
                tracklistEl.appendChild(li);
            });
        }

        function loadSong(index, autoplay) {
            currentIndex = index;
            elapsed = 0;
            noteStep = 0;
            const song = songs[currentIndex];

            nowTitleEl.textContent = song.title;
            nowArtistEl.textContent = song.artist;
            timeTotalEl.textContent = formatTime(song.duration);
            timeCurrentEl.textContent = '0:00';
            progressFill.style.width = '0%';

            renderTracklist();

            if (autoplay) {
                play();
            } else {
                pause();
            }
        }

        function play() {
            ensureAudioContext();
            hintText.style.display = 'none';
            isPlaying = true;
            playBtn.querySelector('svg').innerHTML = '<rect x="5" y="4" width="4" height="16"/><rect x="13" y="4" width="4" height="16"/>';
            coverEl.classList.add('spinning');

            scheduleMelody();

            clearInterval(progressTimer);
            progressTimer = setInterval(() => {
                elapsed += 1;
                const song = songs[currentIndex];
                if (elapsed >= song.duration) {
                    goNext(true);
                    return;
                }
                progressFill.style.width = (elapsed / song.duration * 100) + '%';
                timeCurrentEl.textContent = formatTime(elapsed);
            }, 1000);
        }

        function pause() {
            isPlaying = false;
            playBtn.querySelector('svg').innerHTML = '<polygon points="6 4 20 12 6 20 6 4"/>';
            coverEl.classList.remove('spinning');
            clearInterval(progressTimer);
            clearInterval(noteTimer);
        }

        function togglePlay() {
            if (songs.length === 0) return;
            isPlaying ? pause() : play();
        }

        function goNext(autoplay = isPlaying) {
            const pos = filteredIndices.indexOf(currentIndex);
            const nextPos = (pos + 1) % filteredIndices.length;
            loadSong(filteredIndices[nextPos], autoplay);
        }

        function goPrev() {
            const pos = filteredIndices.indexOf(currentIndex);
            const prevPos = (pos - 1 + filteredIndices.length) % filteredIndices.length;
            loadSong(filteredIndices[prevPos], isPlaying);
        }

        progressTrack.addEventListener('click', (e) => {
            const rect = progressTrack.getBoundingClientRect();
            const ratio = (e.clientX - rect.left) / rect.width;
            const song = songs[currentIndex];
            elapsed = Math.floor(ratio * song.duration);
            progressFill.style.width = (elapsed / song.duration * 100) + '%';
            timeCurrentEl.textContent = formatTime(elapsed);
        });

        searchInput.addEventListener('input', () => {
            const q = searchInput.value.trim().toLowerCase();
            filteredIndices = songs
                .map((song, i) => ({ song, i }))
                .filter(({ song }) => song.title.toLowerCase().includes(q) || song.artist.toLowerCase().includes(q))
                .map(({ i }) => i);
            renderTracklist();
        });

        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', () => goNext());
        prevBtn.addEventListener('click', goPrev);
        volumeSlider.addEventListener('input', () => {
            if (masterGain) {
                masterGain.gain.value = volumeSlider.value / 100;
            }
        });

        loadSong(0, false);

    </script>
</body>

</html>
