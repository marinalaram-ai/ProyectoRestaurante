<!DOCTYPE html>
<html lang="es">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <button type="button" id="btnCambiar" class="btn btn-primary" onclick="funBoton(event)">Boton 1</button>

    <div class="card m-3" style="width: 18rem;">
        <img id="imgCard" src="https://picsum.photos/300/200" class="card-img-top" alt="Imagen del plato">
        <div class="card-body">
            <h5 id="tituloCard" class="card-title">Nombre del platillo</h5>
            <p id="textoCard" class="card-text">Breve descripción del platillo, sus ingredientes principales y lo que
                lo hace especial.</p>
            <a href="#" class="btn btn-primary">Ver más</a>
        </div>
    </div>

    <script>
        function funBoton(event) {
            alert("Hola, soy un mensaje de alerta. El evento que se ha producido es: " + event.type);
        }
        let botonCambiar = document.getElementById("btnCambiar");
        let textoCard = document.getElementById("textoCard");
        let imagenCard = document.getElementById("imgCard");

        botonCambiar.addEventListener("click", function () {
            textoCard.textContent = "¡El texto de la card ha cambiado gracias al evento click!";
            imagenCard.src = "https://picsum.photos/300/200?random=2";
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

</body>

</html>
