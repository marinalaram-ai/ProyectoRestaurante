<!DOCTYPE html>
<html>

<head>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <div style="background-color: rgb(5, 126, 166); padding: 10px;">
        <ul>
            <li>Desayuno</li>
            <li>Comida</li>
            <li>Cena</li>
        </ul>
    </div>
    <div>
        <ol>
            <li>Desayuno</li>
            <li>Comida</li>
            <li>Cena</li>
        </ol>
    </div>
    <table>
        <tr>
            <th>Desayuno</th>
            <th>Comida</th>
            <th>Cena</th>
        </tr>
        <tr>
            <td>Huevos</td>
            <td>Arroz</td>
            <td>Pollo</td>
        </tr>
        <tr>
            <td>Pan</td>
            <td>Frijoles</td>
            <td>Pescado</td>
        </tr>
        <tr>
            <td>Fruta</td>
            <td>Ensalada</td>
            <td>Verduras</td>
        </tr>
    </table>
</body>

</html>
