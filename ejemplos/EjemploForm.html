<!-- Generar un nuevo documento html y crear un formulario con los siguientes campos: 
Nombre, Apellido, Correo Electrónico y un botón de envío. 
Asegúrate de que el formulario sea responsivo y tenga un diseño atractivo 
utilizando Bootstrap.
-->
<html lang="es">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="input-group mb-3">
        <input type="text" class="form-control" placeholder="Nombre" aria-label="Nombre"
            aria-describedby="basic-addon1">
    </div>
    <div class="input-group mb-3">
        <input type="text" class="form-control" placeholder="Apellido" aria-label="Apellido"
            aria-describedby="basic-addon1">
    </div>
    <div class="input-group mb-3">
        <input type="email" class="form-control" placeholder="Correo Electronico" aria-label="Correo Electro nico"
            aria-describedby="basic-addon1">
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-primary mb-3">Enviar</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
