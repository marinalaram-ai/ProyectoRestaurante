<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad 3: Personalizar un formulario de contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-4">
        <h1>Formulario de contacto</h1>
        <form class="w-50">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre">
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" name="correo">
            </div>
            <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
            <button type="reset" class="btn btn-secondary">Limpiar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
        // 3. Seleccionar el primer campo de texto y cambiar su color de fondo
        let primerCampo = document.querySelector("input[type='text']");
        primerCampo.classList.add("bg-success");

        // 4. Seleccionar todos los botones y aplicarles la clase btn-danger
        let botones = document.querySelectorAll("button");
        botones.forEach(function (boton) {
            boton.classList.add("btn-danger");
        });

        // 5. Seleccionar el campo de nombre por su atributo name y cambiar el color del texto
        let campoNombre = document.getElementsByName("nombre")[0];
        campoNombre.classList.add("text-warning");
    </script>
</body>
</html>
